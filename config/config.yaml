# ===========================================================================
# AmbiSense - central configuration
# ---------------------------------------------------------------------------
# Every tunable value lives here.  No thresholds, model names or magic numbers
# are hard-coded in the source.  Secrets (API keys) live in `.env`, never here.
# ===========================================================================

llm:
  # Which provider adapter to use: groq | openai | anthropic | gemini | ollama
  # groq/openai/gemini/ollama all share the OpenAI-compatible adapter.
  provider: groq
  model: llama-3.3-70b-versatile
  # Base URL for OpenAI-compatible providers. Change this one line to switch
  # between Groq / OpenAI / Gemini-compat / a local Ollama server.
  base_url: https://api.groq.com/openai/v1
  temperature: 0.1          # low: we want stable, reproducible analysis
  max_tokens: 2000
  timeout_seconds: 45
  max_retries: 3
  retry_backoff_seconds: 2.0
  # Ask the provider for guaranteed-JSON output where supported.
  request_json_mode: true
  # Cache identical requests on disk so repeated demos cost nothing.
  enable_cache: true
  cache_dir: data/cache

nlp:
  language: en
  spacy_model: en_core_web_md
  # Hard input guards (see preprocessing/cleaner.py)
  min_input_length: 3
  max_input_length: 2000
  max_context_length: 2000
  max_sentences: 10
  # Fraction of ASCII-letter characters below which we refuse the input as
  # probably non-English / not natural language.
  min_ascii_ratio: 0.85

embeddings:
  # Backend for semantic similarity: spacy | sentence_transformers
  backend: spacy
  # Only used when backend == sentence_transformers
  sentence_transformer_model: all-MiniLM-L6-v2

detectors:
  # Master switches - lets you demo one detector at a time in the viva.
  lexical: true
  syntactic: true
  referential: true
  semantic: true
  scope: true
  pragmatic: true

  lexical_settings:
    # WordNet is very fine-grained: "cat" has 8 noun senses and "mat" has 7,
    # so a raw sense count alone flags almost every concrete noun. We
    # therefore require BOTH a sense count and a spread across distinct
    # WordNet semantic domains (lexnames such as noun.animal, noun.artifact).
    # "bank" spans 5 domains; "telescope" spans 1.
    min_senses: 4
    min_domains: 3
    # Only these coarse POS tags are considered.
    allowed_pos: [NOUN, VERB, ADJ, ADV]
    # Words that are technically polysemous but practically unambiguous.
    # Filtering these is what keeps precision from collapsing.
    stoplist: [be, have, do, get, make, take, go, come, give, say, know,
               thing, way, time, year, day, people, man, woman, use, work,
               good, new, first, last, long, great, little, own, other,
               see, look, want, need, try, ask, tell, feel, leave, put,
               sit, stand, turn, keep, let, seem, help, show, part, place]
    min_word_length: 3
    # Even after filtering, a long sentence can yield many candidates. Keep
    # only the strongest few per sentence so the report stays readable.
    # Ranking is by `prior`, so this is deterministic.
    max_candidates_per_sentence: 3

  syntactic_settings:
    # Prepositions that commonly create attachment ambiguity.
    attachment_prepositions: [with, in, on, at, from, by, near, under, over,
                              through, behind, beside]
    detect_pp_attachment: true
    detect_coordination_scope: true
    detect_relative_clause: true

  referential_settings:
    # Personal pronouns we attempt to resolve. Demonstratives ("this",
    # "that") are deliberately excluded: spaCy tags "that" as a subordinating
    # conjunction in "John told David THAT he was late", so including it
    # generates spurious antecedent searches.
    pronouns: [he, she, it, they, him, her, them, his, her, hers, their, theirs]
    # Only tokens carrying these fine-grained tags are treated as pronouns.
    pronoun_tags: [PRP, PRP$]
    # How many preceding sentences to search for antecedents.
    antecedent_window_sentences: 2
    # At least this many surviving candidates makes it a candidate ambiguity.
    min_candidates: 2

  semantic_settings:
    # "Tough constructions": ADJ + to-infinitive, where the subject can be
    # read as either the agent or the patient of the infinitive.
    #   "The chicken is ready to eat."  ->  chicken eats / chicken is eaten
    detect_tough_constructions: true
    tough_adjectives: [ready, easy, hard, difficult, tough, simple, safe,
                       dangerous, pleasant, nice, good, fun, impossible,
                       slow, quick, expensive, cheap]
    # Verbs that cannot take an object, so the passive ("to be eaten")
    # reading is unavailable and the construction is not ambiguous.
    intransitive_verbs: [go, come, arrive, leave, sleep, sit, stand, wait,
                         fall, rise, happen, occur, appear, die]
    # Noun-noun compounds leave the relation between the nouns unstated
    # ("student protest" = by students or about students).
    detect_noun_compounds: true

  scope_settings:
    quantifiers: [every, all, each, some, any, no, none, many, few, most, several]
    negations: [not, "n't", never, no, none, nobody, nothing]
    # "no" appears in both lists above ("no student" is a negative
    # quantifier). Requiring two DISTINCT tokens stops a single word from
    # satisfying both halves of the rule and triggering on itself.
    require_distinct_tokens: true
    # Also flag two quantifiers in one clause ("every / some" interaction).
    detect_quantifier_pairs: true

  pragmatic_settings:
    # Modal + 2nd person interrogative => possible indirect speech act.
    request_modals: [can, could, would, will, might]
    indirect_markers: ["do you know", "is it possible", "would you mind",
                       "have you got", "i wonder"]
    # The literal/indirect split only arises for verbs describing an action
    # the hearer could perform, so a question mark alone is not enough.
    require_question_mark: true

semantic_analysis:
  # Context-based word-sense ranking (the "crane" feature).
  enable_context_sense_ranking: true
  max_senses_considered: 8
  # If the top sense beats the runner-up by more than this cosine margin,
  # we treat the context as having resolved the ambiguity.
  sense_resolution_margin: 0.08
  # Minimum similarity for a sense to be reported at all.
  min_sense_similarity: 0.15

scoring:
  # Weights for the transparent ambiguity score (must sum to 1.0).
  # See docs/ARCHITECTURE.md for the rationale behind each weight.
  weights:
    llm_confidence: 0.45        # how sure the LLM is the ambiguity is genuine
    detector_evidence: 0.25     # strength of the structural NLP evidence
    interpretation_count: 0.15  # more plausible readings => more ambiguous
    context_uncertainty: 0.15   # context failing to disambiguate raises score
  # Score at or above this is reported as "ambiguous".
  ambiguity_threshold: 0.45
  # Candidates the LLM rates below this confidence are discarded.
  confidence_threshold: 0.35
  # Diminishing-returns cap used when normalising interpretation counts.
  max_interpretations_for_score: 4

output:
  # Degrade to an NLP-only report instead of crashing when the LLM is
  # unavailable (no API key, timeout, rate limit, repeated bad JSON).
  allow_degraded_mode: true
  include_nlp_evidence_in_report: true

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%H:%M:%S"
