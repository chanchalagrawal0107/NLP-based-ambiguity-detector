# ===========================================================================
# AmbiSense - central configuration
# ---------------------------------------------------------------------------
# Every tunable value lives here.  No thresholds, model names or magic numbers
# are hard-coded in the source.  Secrets (API keys) live in `.env`, never here.
# ===========================================================================

llm:
  # --- transport only: how to reach the model --------------------------
  # The LLM runs locally through Ollama (https://ollama.com), called over its
  # OpenAI-compatible HTTP API. No API key and no per-request cost.
  # Setup:  ollama pull <model>   (the server listens on port 11434)
  provider: ollama
  # Chosen for practical local speed (README section 13.16): fresh analyses take
  # ~14-38 s, versus minutes on qwen3:14b. Earlier qwen2.5 (7B) judged 11 of 13
  # candidates genuine, including absurd readings, so it is not a good default.
  # Override per run with LLM_MODEL in .env.
  model: qwen3:4b-instruct-2507-q4_K_M
  base_url: http://localhost:11434/v1
  # 0.0: adjudication is classification over evidence, not creative writing.
  # The lowest temperature gives the most repeatable verdicts.
  temperature: 0.0
  # Includes the "thinking" tokens qwen3 produces before its answer: measured
  # up to 1,043 completion tokens for a 3-candidate batch, and a batch may hold
  # 6 candidates, so 4000 leaves headroom against truncation.
  max_tokens: 4000
  # Set from the earlier qwen3:14b runs (108-287 s per sentence, mean 185 s);
  # 600 s is roughly 2x the slowest. The 4B model is far faster, so this is
  # generous headroom for slower hardware rather than a tight limit.
  timeout_seconds: 600
  # Retrying a local timeout re-runs the same slow computation on the same
  # hardware, so only one retry is allowed.
  max_retries: 1
  retry_backoff_seconds: 2.0
  max_retry_wait_seconds: 30
  # Ask the server to constrain the reply to syntactically valid JSON.
  request_json_mode: true
  # Cache fully validated responses on disk. Identical requests (same model,
  # settings and prompt text) are then answered instantly, which matters a lot
  # for a live demo on local hardware. Changing a prompt changes the key, so
  # stale answers are never reused. data/cache is git-ignored.
  enable_cache: true
  cache_dir: data/cache

adjudication:
  # --- what the LLM is asked, and with how much evidence ----------------
  enabled: true
  # true: one request per sentence containing all its candidates, each still
  #       validated independently. The ~600 tokens of instructions are then
  #       processed once per sentence instead of once per candidate, which on
  #       local hardware is the difference between one slow request and several.
  # false: one request per candidate. Fully isolated judgements, more calls.
  batch_candidates: true
  max_candidates_per_request: 6
  # Evidence budget. Only the top-ranked senses are useful to the model, and
  # glosses are truncated: a smaller prompt means lower latency and token use.
  max_senses_in_prompt: 4
  max_gloss_chars: 160
  # After an invalid response, send the validation problems back once and
  # ask for corrected JSON. Bounded: exactly one repair attempt.
  enable_repair: true
  # Second, separate call that rewrites ONLY candidates judged genuine.
  generate_rewrites: false
  # Prompt files, relative to prompts/.
  adjudication_prompt: ambiguity_analysis.txt
  rewrite_prompt: rewrite_generation.txt
  repair_prompt: json_repair.txt

nlp:
  spacy_model: en_core_web_md
  # Hard input guards (see preprocessing/cleaner.py)
  min_input_length: 3
  max_input_length: 2000
  max_context_length: 2000
  # Fraction of ASCII-letter characters below which we refuse the input as
  # probably non-English / not natural language.
  min_ascii_ratio: 0.85

embeddings:
  # Backend for semantic similarity. Only "spacy" has a working adapter today;
  # see IMPLEMENTED_BACKENDS in config.py.
  backend: spacy

detectors:
  # Master switches - lets you demo one detector at a time in the viva.
  lexical: true
  syntactic: true
  referential: true
  semantic: true
  scope: true
  pragmatic: true

  lexical_settings:
    # WordNet is very fine-grained: "cat" has 8 noun senses and "mat" has 7,
    # so a raw sense count alone flags almost every concrete noun. We
    # therefore require BOTH a sense count and a spread across distinct
    # WordNet semantic domains (lexnames such as noun.animal, noun.artifact).
    # "bank" spans 5 domains; "telescope" spans 1.
    min_senses: 4
    min_domains: 3
    # Only these coarse POS tags are considered.
    allowed_pos: [NOUN, VERB, ADJ, ADV]
    # Words that are technically polysemous but practically unambiguous.
    # Filtering these is what keeps precision from collapsing.
    stoplist: [be, have, do, get, make, take, go, come, give, say, know,
               thing, way, time, year, day, people, man, woman, use, work,
               good, new, first, last, long, great, little, own, other,
               see, look, want, need, try, ask, tell, feel, leave, put,
               sit, stand, turn, keep, let, seem, help, show, part, place]
    min_word_length: 3
    # Even after filtering, a long sentence can yield many candidates. Keep
    # only the strongest few per sentence so the report stays readable.
    # Ranking is by `prior`, so this is deterministic.
    max_candidates_per_sentence: 3

  syntactic_settings:
    # Prepositions that commonly create attachment ambiguity.
    attachment_prepositions: [with, in, on, at, from, by, near, under, over,
                              through, behind, beside]
    detect_pp_attachment: true
    detect_coordination_scope: true
    detect_relative_clause: true

  referential_settings:
    # Personal pronouns we attempt to resolve. Demonstratives ("this",
    # "that") are deliberately excluded: spaCy tags "that" as a subordinating
    # conjunction in "John told David THAT he was late", so including it
    # generates spurious antecedent searches.
    pronouns: [he, she, it, they, him, her, them, his, her, hers, their, theirs]
    # Only tokens carrying these fine-grained tags are treated as pronouns.
    pronoun_tags: [PRP, PRP$]
    # How many preceding sentences to search for antecedents.
    antecedent_window_sentences: 2
    # At least this many surviving candidates makes it a candidate ambiguity.
    min_candidates: 2

  semantic_settings:
    # "Tough constructions": ADJ + to-infinitive, where the subject can be
    # read as either the agent or the patient of the infinitive.
    #   "The chicken is ready to eat."  ->  chicken eats / chicken is eaten
    detect_tough_constructions: true
    tough_adjectives: [ready, easy, hard, difficult, tough, simple, safe,
                       dangerous, pleasant, nice, good, fun, impossible,
                       slow, quick, expensive, cheap]
    # Verbs that cannot take an object, so the passive ("to be eaten")
    # reading is unavailable and the construction is not ambiguous.
    intransitive_verbs: [go, come, arrive, leave, sleep, sit, stand, wait,
                         fall, rise, happen, occur, appear, die]
    # Noun-noun compounds leave the relation between the nouns unstated
    # ("student protest" = by students or about students).
    detect_noun_compounds: true

  scope_settings:
    quantifiers: [every, all, each, some, any, no, none, many, few, most, several]
    negations: [not, "n't", never, no, none, nobody, nothing]
    # "no" appears in both lists above ("no student" is a negative
    # quantifier). Requiring two DISTINCT tokens stops a single word from
    # satisfying both halves of the rule and triggering on itself.
    require_distinct_tokens: true
    # Also flag two quantifiers in one clause ("every / some" interaction).
    detect_quantifier_pairs: true

  pragmatic_settings:
    # Modal + 2nd person interrogative => possible indirect speech act.
    request_modals: [can, could, would, will, might]
    indirect_markers: ["do you know", "is it possible", "would you mind",
                       "have you got", "i wonder"]
    # The literal/indirect split only arises for verbs describing an action
    # the hearer could perform, so a question mark alone is not enough.
    require_question_mark: true

semantic_analysis:
  # Phase 3: rank a word's WordNet senses by how similar their glosses are to
  # the surrounding context. Produces EVIDENCE, not a decision.
  enable_context_sense_ranking: true

  # WordNet orders senses by frequency, so the first N are the common ones.
  max_senses_considered: 8

  # --- gloss representation -------------------------------------------
  # Measured on this project's examples: adding WordNet's usage EXAMPLES to
  # the gloss moves the financial sense of "bank" from rank 4 to rank 1 for
  # "I deposited money at the bank." Adding lemma names makes it worse
  # (a "savings_bank" sense then outranks it), so lemma names stay off.
  gloss_includes_examples: true
  gloss_includes_lemma_names: false

  # --- context representation -----------------------------------------
  # Only these coarse POS tags contribute to the context vector; function
  # words and punctuation add noise without adding meaning.
  context_content_pos: [NOUN, VERB, ADJ, ADV, PROPN]
  # Exclude the ambiguous word itself: it contributes the same vector to
  # every comparison and only dilutes the differences between senses.
  exclude_target_word: true
  # Include the user-supplied context passage, when one is given.
  include_user_context: true
  # Below this many usable content words, no ranking is attempted and the
  # status is reported as no_usable_context_vector.
  min_context_words: 1

  # --- reporting -------------------------------------------------------
  # If the top sense beats the runner-up by more than this cosine margin, we
  # report resolved_by_context = true. UNCALIBRATED: chosen by inspecting a
  # handful of examples, not fitted to labelled data. See README limitations.
  sense_resolution_margin: 0.05
  # Senses scoring below this are omitted from the report as uninformative.
  min_sense_similarity: 0.15

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  date_format: "%H:%M:%S"
